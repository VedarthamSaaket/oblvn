version: "3.9"

services:
  oblvn:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "8000"
    env_file:
      - ../.env
    environment:
      OBLVN_HOST: 0.0.0.0
      OBLVN_TRUSTED_PROXIES: "*"
      FLASK_ENV: production
      OBLVN_LOCAL_OPS: "off"
    volumes:
      - oblvn_data:/home/oblvn/.oblvn
    restart: unless-stopped
    networks:
      - oblvn_net

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - oblvn
    restart: unless-stopped
    networks:
      - oblvn_net

volumes:
  oblvn_data:
  nginx_certs:

networks:
  oblvn_net:
    driver: bridge
