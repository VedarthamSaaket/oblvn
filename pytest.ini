[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=backend --cov=ml --cov=agent --cov-report=term-missing --cov-fail-under=80
asyncio_mode = auto
markers =
    system: real server against the oblvn_test Atlas database (needs .env.test)
    e2e: real browser against a real server (needs .env.test and Google Chrome)
